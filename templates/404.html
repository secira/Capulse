{% extends "base.html" %}

{% block title %}Page Not Found — Capulse{% endblock %}

{% block content %}
<style>
.err-page {
  min-height: 78vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
}
.err-box {
  text-align: center;
  max-width: 480px;
  width: 100%;
}
.err-icon-wrap {
  width: 80px; height: 80px;
  background: #fff8ec;
  border: 1.5px solid #fde68a;
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 24px;
}
.err-icon-wrap svg { width: 38px; height: 38px; }
.err-code {
  font-family: 'Poppins', 'Inter', sans-serif;
  font-size: 80px; font-weight: 700; line-height: 1;
  color: #111827;
  letter-spacing: -2px;
  margin-bottom: 8px;
}
.err-title {
  font-family: 'Poppins', 'Inter', sans-serif;
  font-size: 20px; font-weight: 600;
  color: #374151; margin-bottom: 12px;
}
.err-desc {
  font-size: 15px; color: #6b7280;
  line-height: 1.65; margin-bottom: 32px;
}
.err-btns {
  display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
}
.err-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 26px; border-radius: 50px;
  font-size: 15px; font-weight: 600;
  text-decoration: none; transition: all .18s;
}
.err-btn-primary {
  background: #0066cc; color: #fff; border: 2px solid #0066cc;
}
.err-btn-primary:hover { background: #0052a3; border-color: #0052a3; color: #fff; }
.err-btn-outline {
  background: #fff; color: #374151;
  border: 2px solid #d1d5db;
}
.err-btn-outline:hover { border-color: #9ca3af; color: #111827; }
</style>

<div class="err-page">
  <div class="err-box">

    <div class="err-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"
              fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="12" y1="9" x2="12" y2="13" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
        <line x1="12" y1="17" x2="12.01" y2="17" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="err-code">404</div>
    <div class="err-title">Page Not Found</div>
    <p class="err-desc">
      The page you're looking for doesn't exist or has been moved.
    </p>

    <div class="err-btns">
      <a href="{{ url_for('index') }}" class="err-btn err-btn-primary">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
          <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7A1 1 0 003 11h1v6a1 1 0 001 1h4v-4h2v4h4a1 1 0 001-1v-6h1a1 1 0 00.707-1.707l-7-7z"/>
        </svg>
        Go Home
      </a>
      {% if current_user.is_authenticated %}
      <a href="{{ url_for('dashboard') }}" class="err-btn err-btn-outline">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16">
          <rect x="2" y="2" width="7" height="7" rx="1.5"/>
          <rect x="11" y="2" width="7" height="7" rx="1.5"/>
          <rect x="2" y="11" width="7" height="7" rx="1.5"/>
          <rect x="11" y="11" width="7" height="7" rx="1.5"/>
        </svg>
        Dashboard
      </a>
      {% else %}
      <a href="{{ url_for('login') }}" class="err-btn err-btn-outline">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16">
          <path d="M3 10h12M11 5l5 5-5 5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Sign In
      </a>
      {% endif %}
    </div>

  </div>
</div>
{% endblock %}
